<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface);font:var(--type-body);color:var(--text-primary)}.p{padding:16px 20px}.lab{font:var(--weight-medium) var(--text-2xs)/1 var(--font-ui);color:var(--text-tertiary);letter-spacing:var(--tracking-wide)}.mono{font:var(--type-mono);color:var(--text-tertiary)}</style>
</head><body><div class="p" style="display:grid;grid-template-columns:repeat(3,1fr);gap:9px 26px">
<div style="display:flex;align-items:center;gap:10px"><span style="width:14px;height:14px;border-radius:4px;background:var(--state-today);flex:0 0 auto"></span><span style="font:var(--type-ui);color:var(--text-primary);flex:1">Today</span><span class="mono">today</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:14px;height:14px;border-radius:4px;background:var(--state-deadline);flex:0 0 auto"></span><span style="font:var(--type-ui);color:var(--text-primary);flex:1">Deadline</span><span class="mono">deadline</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:14px;height:14px;border-radius:4px;background:var(--state-scheduled);flex:0 0 auto"></span><span style="font:var(--type-ui);color:var(--text-primary);flex:1">Scheduled</span><span class="mono">scheduled</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:14px;height:14px;border-radius:4px;background:var(--state-someday);flex:0 0 auto"></span><span style="font:var(--type-ui);color:var(--text-primary);flex:1">Someday</span><span class="mono">someday</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:14px;height:14px;border-radius:4px;background:var(--state-logged);flex:0 0 auto"></span><span style="font:var(--type-ui);color:var(--text-primary);flex:1">Logged</span><span class="mono">logged</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:14px;height:14px;border-radius:4px;background:var(--state-progress);flex:0 0 auto"></span><span style="font:var(--type-ui);color:var(--text-primary);flex:1">In progress</span><span class="mono">progress</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:14px;height:14px;border-radius:4px;background:var(--state-open);flex:0 0 auto"></span><span style="font:var(--type-ui);color:var(--text-primary);flex:1">Open</span><span class="mono">open</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:14px;height:14px;border-radius:4px;background:var(--state-canceled);flex:0 0 auto"></span><span style="font:var(--type-ui);color:var(--text-primary);flex:1">Canceled</span><span class="mono">canceled</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:14px;height:14px;border-radius:4px;background:var(--accent);flex:0 0 auto"></span><span style="font:var(--type-ui);color:var(--text-primary);flex:1">Selected</span><span class="mono">accent</span></div>
</div></body></html>
