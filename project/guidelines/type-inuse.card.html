<!-- @dsCard group="Type" viewport="700x160" name="Type in use" subtitle="One list, four type roles" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface);font:var(--type-body);color:var(--text-primary)}.p{padding:16px 20px}.lab{font:var(--weight-medium) var(--text-2xs)/1 var(--font-ui);color:var(--text-tertiary);letter-spacing:var(--tracking-wide)}.mono{font:var(--type-mono);color:var(--text-tertiary)}</style>
</head><body><div class="p" style="background:var(--canvas)">
<div style="display:flex;align-items:center;gap:12px"><span style="width:20px;height:20px;border-radius:50%;border:2px solid var(--state-open)"></span><span style="font:var(--type-title);letter-spacing:var(--tracking-tight)">Prepare Presentation</span></div>
<div style="font:var(--type-body);color:var(--text-secondary);margin:6px 0 0 32px">Keep the talk and slides simple.</div>
<div style="font:var(--type-section);color:var(--text-accent);margin:16px 0 5px 0;padding-bottom:5px;border-bottom:1px solid var(--border-subtle)">Slides and notes</div>
<div style="display:flex;align-items:center;gap:10px;padding:4px 0"><span style="width:16px;height:16px;border-radius:4px;border:1.5px solid var(--state-open)"></span><span style="font:var(--type-ui);font-size:var(--text-base);flex:1">Revise introduction</span><span style="font:var(--type-caption);color:var(--text-tertiary)">5 days left</span></div>
<div style="display:flex;align-items:center;gap:10px;padding:4px 0"><span style="width:16px;height:16px;border-radius:4px;border:1.5px solid var(--state-open)"></span><span style="font:var(--type-ui);font-size:var(--text-base);flex:1">Simplify slide layouts</span></div>
</div></body></html>
