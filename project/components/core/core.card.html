<!doctype html><html><head><meta charset="utf-8"><title>Core</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--canvas);font:var(--type-body)}#root{padding:16px 18px}.lab{font:var(--weight-semibold) var(--text-2xs)/1 var(--font-ui);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-tertiary);margin-bottom:10px}.grp{display:flex;flex-direction:column;gap:10px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.cols{display:grid;gap:22px}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Button, IconButton, Tag, Badge, Segmented, ProgressRing } = window.TallyDesignSystem_788326;
function Demo(){
  const [f,setF]=React.useState('All');
  return <div className="cols" style={{gridTemplateColumns:'1fr 1fr'}}>
    <div className="grp">
      <div><div className="lab">Button</div><div className="row">
        <Button variant="primary" icon="plus">New To-Do</Button>
        <Button>Cancel</Button>
        <Button variant="ghost" icon="filter">Filter</Button>
        <Button variant="danger" size="sm">Delete</Button>
        <Button size="sm" disabled>Disabled</Button>
      </div></div>
      <div><div className="lab">Icon button</div><div className="row">
        <IconButton icon="plus" label="New" /><IconButton icon="calendar-days" label="When" />
        <IconButton icon="tag" label="Tags" active /><IconButton icon="list-checks" label="Checklist" />
        <IconButton icon="flag" label="Deadline" /><IconButton icon="trash-2" label="Delete" tone="danger" />
        <IconButton icon="ellipsis" label="More" />
      </div></div>
    </div>
    <div className="grp">
      <div><div className="lab">Tag</div><div className="row">
        <Tag>Errand</Tag><Tag tone="green">Important</Tag><Tag tone="blue" icon="tag">Office</Tag>
        <Tag tone="red">Overdue</Tag><Tag variant="outline" size="sm">Waiting On</Tag>
      </div></div>
      <div><div className="lab">Badge &amp; segmented</div><div className="row">
        <Badge>8</Badge><Badge tone="neutral">24</Badge><Badge tone="accent">2</Badge><Badge tone="danger">1</Badge>
        <span style={{width:8}} />
        <Segmented options={['All','Important','Diane']} value={f} onChange={setF} />
      </div></div>
      <div><div className="lab">Progress ring</div><div className="row">
        {[0,0.15,0.4,0.7,1].map(v=><ProgressRing key={v} value={v} size={18} thickness={2} />)}
      </div></div>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
