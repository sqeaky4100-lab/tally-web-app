<!doctype html>
<html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{width:1280px;height:854px;overflow:hidden}.tile{display:grid;grid-template-columns:1fr 300px;width:1280px;height:854px}.mark{background:var(--blue-500);display:flex;align-items:center;justify-content:center;gap:44px}.mark img{width:190px;height:190px;display:block}.name{font:var(--weight-bold) 210px/1 var(--font-display);letter-spacing:-0.045em;color:#fff}.strip{display:grid;grid-template-rows:repeat(4,1fr);height:854px}</style>
</head><body><div class="tile"><div class="mark"><img src="assets/brand/tally-mark.svg" alt=""><span class="name">Tally</span></div><div class="strip"><div style="background:var(--yellow-400)"></div><div style="background:var(--teal-500)"></div><div style="background:var(--red-500)"></div><div style="background:var(--gray-900)"></div></div></div></body></html>
