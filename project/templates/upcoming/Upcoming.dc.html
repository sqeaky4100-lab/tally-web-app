<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Upcoming agenda" description="A dated agenda — month rules, day headings, and the floating new-to-do action." -->
<helmet><script src="./ds-base.js"></script></helmet>
<div style="display:flex;height:100vh;overflow:hidden;background:var(--surface);color:var(--text-primary);font:var(--type-body)">

  <div style="width:248px;flex:0 0 auto;display:flex;flex-direction:column;background:var(--canvas);border-right:1px solid var(--border-subtle)">
    <div style="display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;flex:0 0 auto">
      <x-import component-from-global-scope="TallyDesignSystem_788326.BrandMark" size="{{ 20 }}" variant="mono" hint-size="20px,20px"></x-import>
      <span style="font-size:13px;font-weight:600;letter-spacing:-.01em">Tally</span>
    </div>
    <div style="flex:1;overflow-y:auto;padding:0 8px 12px">
      <sc-for list="{{ lists }}" as="row" hint-placeholder-count="5">
        <x-import component-from-global-scope="TallyDesignSystem_788326.SidebarItem" icon="{{ row.icon }}" icon-color="{{ row.color }}" label="{{ row.label }}" count="{{ row.count }}" active="{{ row.active }}" hint-size="100%,28px"></x-import>
      </sc-for>
    </div>
  </div>

  <div style="flex:1;min-width:0;display:flex;flex-direction:column;position:relative">
    <div style="display:flex;align-items:center;gap:6px;height:38px;padding:0 12px;flex:0 0 auto">
      <span style="flex:1"></span>
      <x-import component-from-global-scope="TallyDesignSystem_788326.IconButton" icon="search" label="Quick Find" size="sm" hint-size="24px,24px"></x-import>
      <x-import component-from-global-scope="TallyDesignSystem_788326.IconButton" icon="sliders-horizontal" label="View options" size="sm" hint-size="24px,24px"></x-import>
    </div>

    <div style="flex:1;min-height:0;overflow-y:auto">
      <div style="max-width:720px;margin:0 auto;padding:34px 32px 140px">
        <x-import component-from-global-scope="TallyDesignSystem_788326.ViewHeader" title="{{ viewTitle }}" icon="calendar-days" icon-color="var(--state-deadline)" subtitle="{{ subtitle }}" hint-size="100%,44px"></x-import>

        <div style="margin-top:26px">
          <sc-for list="{{ days }}" as="day" hint-placeholder-count="4">
            <div style="margin-bottom:30px">
              <div style="display:flex;align-items:baseline;gap:9px;padding:0 10px 8px;border-bottom:1px solid var(--border-subtle)">
                <span style="font-size:14px;font-weight:600;letter-spacing:-.01em">{{ day.label }}</span>
                <span style="font-size:12px;color:var(--text-tertiary)">{{ day.weekday }}</span>
                <span style="flex:1"></span>
                <sc-if value="{{ day.badge }}" hint-placeholder-val="{{ true }}">
                  <x-import component-from-global-scope="TallyDesignSystem_788326.Badge" hint-size="18px,16px">{{ day.badge }}</x-import>
                </sc-if>
              </div>
              <div style="margin-top:6px">
                <sc-for list="{{ day.items }}" as="task" hint-placeholder-count="3">
                  <x-import component-from-global-scope="TallyDesignSystem_788326.TaskRow" title="{{ task.title }}" state="{{ task.state }}" meta="{{ task.meta }}" tags="{{ task.tags }}" hint-size="100%,30px"></x-import>
                </sc-for>
                <sc-if value="{{ day.empty }}" hint-placeholder-val="{{ false }}">
                  <div style="padding:7px 10px;font-size:13px;color:var(--text-tertiary)">Nothing scheduled.</div>
                </sc-if>
              </div>
            </div>
          </sc-for>
        </div>
      </div>
    </div>

    <div style="position:absolute;right:32px;bottom:32px">
      <x-import component-from-global-scope="TallyDesignSystem_788326.FloatingAdd" size="{{ 56 }}" hint-size="56px,56px"></x-import>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800},&quot;viewTitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Upcoming&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showSubtitle&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;density&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;roomy&quot;,&quot;dense&quot;],&quot;default&quot;:&quot;roomy&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const dense = p.density === 'dense';
    return {
      viewTitle: p.viewTitle ?? 'Upcoming',
      subtitle: p.showSubtitle === false ? '' : 'Next 14 days',
      lists: [
        { icon: 'inbox', color: 'var(--blue-400)', label: 'Inbox', count: 2, active: false },
        { icon: 'star', color: 'var(--state-today)', label: 'Today', count: 5, active: false },
        { icon: 'calendar-days', color: 'var(--state-deadline)', label: 'Upcoming', count: 0, active: true },
        { icon: 'layers', color: 'var(--state-scheduled)', label: 'Anytime', count: 0, active: false },
        { icon: 'archive', color: 'var(--state-someday)', label: 'Someday', count: 0, active: false },
      ],
      days: [
        { label: 'Tomorrow', weekday: 'Wed 14 May', badge: 3, items: [
          { title: 'Send the revised estimate', state: 'open', meta: ['file-text'], tags: [{ label: 'Work' }] },
          { title: 'Book the studio for Thursday', state: 'open', meta: [], tags: [] },
          { title: 'Renew the parking permit', state: 'open', meta: ['repeat'], tags: [] },
        ] },
        { label: 'Thursday', weekday: '15 May', badge: 1, items: [
          { title: 'Photograph the stationery set', state: 'progress', meta: ['list-checks'], tags: [{ label: 'Identity' }] },
        ] },
        { label: 'Friday', weekday: '16 May', badge: 0, empty: true, items: [] },
        { label: 'Monday', weekday: '19 May', badge: 2, items: [
          { title: 'Quarterly numbers to Rae', state: 'open', meta: [], tags: [{ label: 'Work' }] },
          { title: 'Cancel the old domain', state: 'open', meta: [], tags: [] },
        ] },
      ].filter(function (d) { return dense ? !d.empty : true; }),
    };
  }
}

</script>
</body>
</html>
