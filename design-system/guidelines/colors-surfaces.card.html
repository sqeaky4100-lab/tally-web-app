<!-- @dsCard group="Colors" viewport="700x180" name="Surfaces & ink, both themes" subtitle="Dark is not an inversion — the canvas drops, panels lift" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface);font:var(--type-body);color:var(--text-primary)}.p{padding:16px 20px}.lab{font:var(--weight-medium) var(--text-2xs)/1 var(--font-ui);color:var(--text-tertiary);letter-spacing:var(--tracking-wide)}.mono{font:var(--type-mono);color:var(--text-tertiary)}</style>
</head><body><div style="display:grid;grid-template-columns:1fr 1fr;height:180px">
<div data-theme="light" style="background:var(--canvas);padding:16px 20px">
<div class="lab" style="text-transform:uppercase;letter-spacing:var(--tracking-caps)">light</div>
<div style="margin-top:10px;background:var(--surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:12px 14px">
<div style="font:var(--weight-semibold) var(--text-base)/1.3 var(--font-ui);color:var(--text-primary)">Primary text</div>
<div style="margin-top:5px;font:var(--type-ui);color:var(--text-secondary)">Secondary — notes and descriptions</div>
<div style="margin-top:4px;font:var(--type-caption);color:var(--text-tertiary)">Tertiary — counts, dates, glyphs</div>
<div style="margin-top:10px;display:flex;gap:6px">
<span style="flex:1;height:22px;border-radius:var(--radius-sm);background:var(--surface-sunken)"></span>
<span style="flex:1;height:22px;border-radius:var(--radius-sm);background:var(--surface-selected)"></span>
<span style="flex:1;height:22px;border-radius:var(--radius-sm);background:var(--accent)"></span>
</div></div></div><div data-theme="dark" style="background:var(--canvas);padding:16px 20px">
<div class="lab" style="text-transform:uppercase;letter-spacing:var(--tracking-caps)">dark</div>
<div style="margin-top:10px;background:var(--surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:12px 14px">
<div style="font:var(--weight-semibold) var(--text-base)/1.3 var(--font-ui);color:var(--text-primary)">Primary text</div>
<div style="margin-top:5px;font:var(--type-ui);color:var(--text-secondary)">Secondary — notes and descriptions</div>
<div style="margin-top:4px;font:var(--type-caption);color:var(--text-tertiary)">Tertiary — counts, dates, glyphs</div>
<div style="margin-top:10px;display:flex;gap:6px">
<span style="flex:1;height:22px;border-radius:var(--radius-sm);background:var(--surface-sunken)"></span>
<span style="flex:1;height:22px;border-radius:var(--radius-sm);background:var(--surface-selected)"></span>
<span style="flex:1;height:22px;border-radius:var(--radius-sm);background:var(--accent)"></span>
</div></div></div>
</div></body></html>
