<!-- @dsCard group="Type" viewport="700x120" name="Mono & numerals" subtitle="JetBrains Mono for shortcuts; tabular figures everywhere else" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface);font:var(--type-body);color:var(--text-primary)}.p{padding:16px 20px}.lab{font:var(--weight-medium) var(--text-2xs)/1 var(--font-ui);color:var(--text-tertiary);letter-spacing:var(--tracking-wide)}.mono{font:var(--type-mono);color:var(--text-tertiary)}</style>
</head><body><div class="p">
<div style="display:flex;align-items:center;gap:20px">
<span style="font:var(--type-mono);color:var(--text-primary);font-size:13px">⌘N  ⌘⇧D  ⌘K  ⌥⌘S</span>
<span style="width:1px;height:26px;background:var(--border-default)"></span>
<span style="font:var(--weight-medium) 20px/1 var(--font-ui);font-variant-numeric:tabular-nums;color:var(--text-primary)">0123456789</span>
<span style="font:var(--type-caption);color:var(--text-tertiary)">tabular-nums</span>
</div>
<div class="mono" style="margin-top:14px">--font-mono · --type-mono 12/1.34 — keyboard shortcuts, id strings. Never body copy.</div>
</div></body></html>
