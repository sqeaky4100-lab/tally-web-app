<!-- @dsCard group="Brand" viewport="700x150" name="The checkbox" subtitle="The system's defining mark — four states, two shapes" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface);font:var(--type-body);color:var(--text-primary)}.p{padding:16px 20px}.lab{font:var(--weight-medium) var(--text-2xs)/1 var(--font-ui);color:var(--text-tertiary);letter-spacing:var(--tracking-wide)}.mono{font:var(--type-mono);color:var(--text-tertiary)}</style>
</head><body><div class="p" style="display:flex;gap:34px;align-items:flex-start">
<div><div class="lab" style="margin-bottom:14px">To-do</div><div style="display:flex;gap:22px">
<div style="text-align:center"><span style="display:block;width:20px;height:20px;border-radius:4px;border:1.9px solid var(--state-open);box-sizing:border-box"></span><div class="mono" style="margin-top:8px">open</div></div>
<div style="text-align:center"><span style="display:block;position:relative;width:20px;height:20px;border-radius:4px;border:1.9px solid var(--state-progress);box-sizing:border-box;overflow:hidden"><span style="position:absolute;inset:0;width:50%;background:var(--state-progress)"></span></span><div class="mono" style="margin-top:8px">progress</div></div>
<div style="text-align:center"><span style="display:flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:4px;background:var(--state-done);box-sizing:border-box"><svg width="13" height="13" viewBox="0 0 12 12" fill="none"><path d="M2.2 6.3 L4.7 8.8 L9.9 3.3" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></span><div class="mono" style="margin-top:8px">done</div></div>
<div style="text-align:center"><span style="display:flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:4px;background:var(--state-canceled);box-sizing:border-box"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.4 6 H9.6" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/></svg></span><div class="mono" style="margin-top:8px">canceled</div></div>
</div></div><div><div class="lab" style="margin-bottom:14px">Project</div><div style="display:flex;gap:22px">
<div style="text-align:center"><span style="display:block;width:20px;height:20px;border-radius:50%;border:1.9px solid var(--state-open);box-sizing:border-box"></span><div class="mono" style="margin-top:8px">open</div></div>
<div style="text-align:center"><span style="display:block;position:relative;width:20px;height:20px;border-radius:50%;border:1.9px solid var(--state-progress);box-sizing:border-box;overflow:hidden"><span style="position:absolute;inset:0;width:50%;background:var(--state-progress)"></span></span><div class="mono" style="margin-top:8px">progress</div></div>
<div style="text-align:center"><span style="display:flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--state-done);box-sizing:border-box"><svg width="13" height="13" viewBox="0 0 12 12" fill="none"><path d="M2.2 6.3 L4.7 8.8 L9.9 3.3" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></span><div class="mono" style="margin-top:8px">done</div></div>
<div style="text-align:center"><span style="display:flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--state-canceled);box-sizing:border-box"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.4 6 H9.6" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/></svg></span><div class="mono" style="margin-top:8px">canceled</div></div>
</div></div>
</div></body></html>
