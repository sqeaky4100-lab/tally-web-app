<!-- @dsCard group="Spacing" viewport="700x170" name="List rhythm" subtitle="30px rows, no gap, no rules — grouping does the work" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface);font:var(--type-body);color:var(--text-primary)}.p{padding:16px 20px}.lab{font:var(--weight-medium) var(--text-2xs)/1 var(--font-ui);color:var(--text-tertiary);letter-spacing:var(--tracking-wide)}.mono{font:var(--type-mono);color:var(--text-tertiary)}</style>
</head><body><div class="p" style="background:var(--canvas)"><div style="max-width:420px">
<div style="display:flex;align-items:center;gap:10px;height:30px;padding:0 10px"><span style="width:16px;height:16px;border-radius:4px;border:1.5px solid var(--state-open);flex:0 0 auto"></span><span style="font:var(--type-ui);font-size:var(--text-base)">Revise introduction</span></div><div style="display:flex;align-items:center;gap:10px;height:30px;padding:0 10px"><span style="width:16px;height:16px;border-radius:4px;border:1.5px solid var(--state-open);flex:0 0 auto"></span><span style="font:var(--type-ui);font-size:var(--text-base)">Simplify slide layouts</span></div><div style="display:flex;align-items:center;gap:10px;height:30px;padding:0 10px"><span style="width:16px;height:16px;border-radius:4px;border:1.5px solid var(--state-open);flex:0 0 auto"></span><span style="font:var(--type-ui);font-size:var(--text-base)">Review quarterly data</span></div>
<div style="font:var(--type-section);color:var(--text-accent);margin:20px 0 0;padding:6px 10px 5px;border-bottom:1px solid var(--border-subtle)">Preparation</div>
<div style="display:flex;align-items:center;gap:10px;height:30px;padding:0 10px"><span style="width:16px;height:16px;border-radius:4px;border:1.5px solid var(--state-open);flex:0 0 auto"></span><span style="font:var(--type-ui);font-size:var(--text-base)">Email John for presentation tips</span></div><div style="display:flex;align-items:center;gap:10px;height:30px;padding:0 10px"><span style="width:16px;height:16px;border-radius:4px;border:1.5px solid var(--state-open);flex:0 0 auto"></span><span style="font:var(--type-ui);font-size:var(--text-base)">Time a full rehearsal</span></div>
</div><div class="mono" style="margin-top:10px">row 30px · gap 0 · group header margin-top --space-8 (20px)</div></div></body></html>
