<!-- @dsCard group="Spacing" viewport="700x150" name="Layout constants" subtitle="Fixed widths and heights the whole app agrees on" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface);font:var(--type-body);color:var(--text-primary)}.p{padding:16px 20px}.lab{font:var(--weight-medium) var(--text-2xs)/1 var(--font-ui);color:var(--text-tertiary);letter-spacing:var(--tracking-wide)}.mono{font:var(--type-mono);color:var(--text-tertiary)}</style>
</head><body><div class="p" style="display:grid;grid-template-columns:1fr 1fr;gap:9px 32px">
<div style="display:flex;align-items:baseline;gap:10px;padding:4px 0;border-bottom:1px solid var(--border-subtle)"><span class="mono" style="flex:1;color:var(--text-secondary)">--sidebar-width</span><span style="font:var(--type-ui-strong)">248px</span><span class="lab" style="flex:0 0 130px;text-align:right">left rail</span></div><div style="display:flex;align-items:baseline;gap:10px;padding:4px 0;border-bottom:1px solid var(--border-subtle)"><span class="mono" style="flex:1;color:var(--text-secondary)">--detail-width</span><span style="font:var(--type-ui-strong)">380px</span><span class="lab" style="flex:0 0 130px;text-align:right">right detail pane</span></div><div style="display:flex;align-items:baseline;gap:10px;padding:4px 0;border-bottom:1px solid var(--border-subtle)"><span class="mono" style="flex:1;color:var(--text-secondary)">--content-max</span><span style="font:var(--type-ui-strong)">720px</span><span class="lab" style="flex:0 0 130px;text-align:right">list column</span></div><div style="display:flex;align-items:baseline;gap:10px;padding:4px 0;border-bottom:1px solid var(--border-subtle)"><span class="mono" style="flex:1;color:var(--text-secondary)">--content-gutter</span><span style="font:var(--type-ui-strong)">32px</span><span class="lab" style="flex:0 0 130px;text-align:right">canvas inset</span></div><div style="display:flex;align-items:baseline;gap:10px;padding:4px 0;border-bottom:1px solid var(--border-subtle)"><span class="mono" style="flex:1;color:var(--text-secondary)">--row-height</span><span style="font:var(--type-ui-strong)">30px</span><span class="lab" style="flex:0 0 130px;text-align:right">one to-do</span></div><div style="display:flex;align-items:baseline;gap:10px;padding:4px 0;border-bottom:1px solid var(--border-subtle)"><span class="mono" style="flex:1;color:var(--text-secondary)">--row-indent</span><span style="font:var(--type-ui-strong)">26px</span><span class="lab" style="flex:0 0 130px;text-align:right">text left edge</span></div><div style="display:flex;align-items:baseline;gap:10px;padding:4px 0;border-bottom:1px solid var(--border-subtle)"><span class="mono" style="flex:1;color:var(--text-secondary)">--toolbar-height</span><span style="font:var(--type-ui-strong)">44px</span><span class="lab" style="flex:0 0 130px;text-align:right">top / bottom strip</span></div><div style="display:flex;align-items:baseline;gap:10px;padding:4px 0;border-bottom:1px solid var(--border-subtle)"><span class="mono" style="flex:1;color:var(--text-secondary)">--hit-target-min</span><span style="font:var(--type-ui-strong)">32px</span><span class="lab" style="flex:0 0 130px;text-align:right">smallest tap target</span></div>
</div></body></html>
